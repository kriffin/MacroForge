name: Release

on:
  push:
    tags: ['v*']

# The packager creates the GitHub release: the default token is read-only
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Builds the zip from .pkgmeta and uploads it to CurseForge (project ID in
      # the .toc, token in the CF_API_KEY secret) and to the GitHub release.
      # CurseForge upload only when the CF_API_KEY secret is set; without it
      # the packager still builds the zip and attaches it to the release.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
