name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
      - name: Install luacheck (optional)
        continue-on-error: true
        run: sudo luarocks --lua-version=5.3 install luacheck
      - name: Syntax check every file
        run: luac5.3 -p $(git ls-files '*.lua')
      - name: Headless tests
        run: bash tests/run.sh
      - name: Lint (addon files only, informative)
        continue-on-error: true
        run: luacheck .
      - name: Locales have the same keys
        run: |
          python3 - <<'PY'
          import re, glob, sys
          key = re.compile(r'^L\["([^"]+)"\]\s*=', re.M)
          en = set(key.findall(open('Locales/enUS.lua').read()))
          used = set()
          for f in glob.glob('*.lua'):
              used |= set(re.findall(r'L\["([A-Z0-9_]+)"\]', open(f).read()))
          missing = (used - en) - {'TPL_PH_KEY'}
          bad = False
          if missing:
              print('undefined keys:', sorted(missing))
              bad = True
          locales = sorted(f for f in glob.glob('Locales/*.lua') if not f.endswith('enUS.lua'))
          for f in locales:
              diff = en ^ set(key.findall(open(f).read()))
              if diff:
                  print(f, 'mismatch with enUS:', sorted(diff))
                  bad = True
          if bad:
              sys.exit(1)
          print(len(en), 'keys,', len(locales) + 1, 'locales in sync')
          PY
